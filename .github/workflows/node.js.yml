name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build and generate static pages
        run: |
          echo "Building project and generating static pages..."
          node scripts/build-static.js
        env:
          NODE_ENV: production
          CI: true
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        
      - name: Verify build output
        run: |
          echo "Verifying build completed successfully..."
          test -f dist/index.html || { echo "✗ index.html missing"; exit 1; }
          test -f dist/sitemap.xml || { echo "✗ sitemap.xml missing"; exit 1; }
          test -d dist/assets || { echo "✗ assets directory missing"; exit 1; }
          test -f dist/404.html || { echo "✗ 404.html missing"; exit 1; }

          echo "Checking every sitemap URL resolves to a pre-rendered file..."
          MISSING=0
          for LOC in $(grep -o '<loc>[^<]*</loc>' dist/sitemap.xml | sed 's|</\?loc>||g'); do
            PATHNAME=$(echo "$LOC" | sed 's|https\?://[^/]*||')
            if [ "$PATHNAME" = "/" ]; then
              FILE="dist/index.html"
            else
              FILE="dist${PATHNAME}/index.html"
            fi
            if [ ! -f "$FILE" ]; then
              echo "✗ missing pre-rendered page for $LOC"
              MISSING=$((MISSING+1))
            fi
          done
          [ "$MISSING" -eq 0 ] || { echo "$MISSING sitemap URL(s) are not pre-rendered"; exit 1; }

          echo "✓ $(grep -c '<loc>' dist/sitemap.xml) URLs pre-rendered and listed in the sitemap"

        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
