name: Weekly Search Console report

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect last week's Google search data
        run: node scripts/search-console-sync.mjs weekly
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Open an issue if something needs attention
        if: hashFiles('search-alerts.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Search Console alert ($(date -u +%Y-%m-%d))" --body-file search-alerts.md
